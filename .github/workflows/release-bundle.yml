name: Release bundle

on:
  workflow_dispatch:

# Требуются секреты репозитория:
#   KEYSTORE_BASE64  — keystore, закодированный: base64 -w0 upload.jks
#   KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed AAB
        run: |
          gradle bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: arroom-release-aab
          path: app/build/outputs/bundle/release/*.aab
